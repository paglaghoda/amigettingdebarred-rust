[workspace]
members = ["crates/domain", "crates/server", "crates/web", "crates/migrate"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
